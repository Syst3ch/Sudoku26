<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP מקומי (assets/) כדי שהרינדור יעבוד גם בלי גישה ל-CDN -->
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Heebo — פונט עברי מקומי (assets/fonts, רישיון OFL) */
      @font-face {
        font-family: "Heebo";
        font-weight: 400;
        src: url("assets/fonts/heebo-hebrew-400-normal.woff2") format("woff2");
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: "Heebo";
        font-weight: 400;
        src: url("assets/fonts/heebo-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Heebo";
        font-weight: 800;
        src: url("assets/fonts/heebo-hebrew-800-normal.woff2") format("woff2");
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: "Heebo";
        font-weight: 800;
        src: url("assets/fonts/heebo-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --ground: #0b1020;
        --ink: #ffffff;
        --accent: #facc15;
        --font-display: "Heebo", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 128px;
        font-weight: 800;
      }
      #subtitle {
        color: var(--accent);
        font-size: 52px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="card" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <h1 id="title">עורך הווידאו שלי</h1>
        <p id="subtitle">נבנה עם HyperFrames</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { scale: 0.92 }, { scale: 1, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.7);
      tl.to(["#title", "#subtitle"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
